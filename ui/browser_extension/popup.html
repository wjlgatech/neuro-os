<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Founder Loop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="fl-header">
    <h1>Founder Loop</h1>
    <button id="fl-refresh" title="Refresh">↻</button>
  </header>

  <main id="fl-popup-root">
    <div class="fl-loading">Loading…</div>
  </main>

  <!-- Fix 2 (design audit): explain the tank percentage to first-time users.
       The tank % is the badge number; without context, "67%" doesn't mean
       anything. Show this as static HTML so it's visible even if the
       FounderLoopUI module fails to load. -->
  <aside class="fl-legend">
    <strong>Tank</strong> = today's reward economy. Credits from evidenced
    priorities, debits from distraction time. Ration unlocks at the
    threshold (default 90%).
    <a href="http://127.0.0.1:8765/how-it-works"
       target="_blank" rel="noopener">how it works</a>
  </aside>

  <footer class="fl-footer">
    <div id="fl-daemon-status">checking daemon…</div>
    <div class="fl-actions">
      <button id="fl-tick-btn">Tick now</button>
      <button id="fl-settings-btn" title="Settings">⚙</button>
    </div>
  </footer>

  <section id="fl-settings" class="fl-hidden">
    <label>Daemon URL</label>
    <input id="fl-daemon-url" type="text" placeholder="http://127.0.0.1:8765">
    <button id="fl-save-settings">Save</button>
  </section>

  <script src="lib/api.js"></script>
  <script src="lib/card.js"></script>
  <script src="popup.js"></script>
</body>
</html>
