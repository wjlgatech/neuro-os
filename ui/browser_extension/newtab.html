<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Founder Loop · New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="fl-newtab">
    <header>
      <div class="fl-greeting" id="fl-greeting">…</div>
      <div class="fl-date" id="fl-date"></div>
    </header>

    <section id="fl-tank-section" class="fl-card-block fl-loading">Loading…</section>
    <!-- Tank-percentage legend (Fix 2 from design audit). -->
    <aside class="fl-legend">
      <strong>Tank</strong> = today's reward economy. Credits from evidenced
      priorities, debits from distraction time. Ration unlocks at the
      threshold (default 90%).
      <a href="http://127.0.0.1:8765/how-it-works"
         target="_blank" rel="noopener">how it works</a>
    </aside>
    <section id="fl-card-section" class="fl-hidden"></section>

    <section id="fl-priorities-section" class="fl-card-block fl-hidden">
      <h2>Today's priorities</h2>
      <ul id="fl-priorities-list"></ul>
    </section>

    <section id="fl-recent-section" class="fl-card-block fl-hidden">
      <h2>Last few ticks</h2>
      <ul id="fl-recent-list"></ul>
    </section>

    <footer>
      <span id="fl-daemon-status">checking daemon…</span>
      <span class="fl-spacer"></span>
      <a href="https://github.com/wjlgatech/neuro-os" target="_blank" rel="noopener">neuro-os</a>
    </footer>
  </main>

  <script src="lib/api.js"></script>
  <script src="lib/card.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
