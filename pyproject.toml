[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-os"
version = "0.3.0"
description = "Self-evolving, self-modifying neuroscience knowledge OS — closed-loop OEC over both knowledge and code, with allowlisted patches and sandboxed validation. Built on flywheel-loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Paul Jialiang Wu" },
]
keywords = [
    "knowledge-graph",
    "self-evolving",
    "self-modifying",
    "neuroscience",
    "ontology",
    "agent",
    "oec",
    "closed-loop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flywheel-loop>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
neuro-os = "agent.cli:main"

[project.urls]
Homepage = "https://github.com/wjlgatech/neuro-os"
Repository = "https://github.com/wjlgatech/neuro-os"
Issues = "https://github.com/wjlgatech/neuro-os/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
