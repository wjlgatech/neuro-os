<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Founder Loop</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel-2: #21262d;
      --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
      --accent: #58a6ff; --green: #56d364;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.7; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 28px 80px 28px; }
    nav { font-size: 19px; color: var(--text-dim); margin-bottom: 18px; }
    nav a { color: var(--accent); text-decoration: none; margin-right: 14px; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 30px; font-weight: 600; margin: 12px 0 4px 0; letter-spacing: -0.4px; }
    h2 { font-size: 20px; font-weight: 600; margin: 32px 0 8px 0; letter-spacing: -0.2px; }
    h3 { font-size: 19px; font-weight: 600; margin: 24px 0 8px 0; color: var(--text); }
    p { margin: 8px 0 14px 0; color: var(--text); }
    a { color: var(--accent); }
    a:hover { text-decoration: underline; }
    blockquote {
      margin: 16px 0; padding: 4px 18px; border-left: 3px solid var(--accent);
      background: var(--panel); border-radius: 4px;
    }
    blockquote p { color: var(--text-dim); font-style: italic; }
    code {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 6px; font-size: 0.9em;
      color: var(--green); font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    pre {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; overflow-x: auto;
      font-size: 20px; line-height: 1.5;
    }
    pre code {
      background: none; border: none; padding: 0; color: var(--text);
    }
    ul, ol { padding-left: 26px; margin: 8px 0 14px 0; }
    li { margin-bottom: 4px; }
    table {
      width: 100%; border-collapse: collapse; margin: 14px 0;
      font-size: 19px;
    }
    th, td {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      text-align: left; vertical-align: top;
    }
    th { color: var(--text-dim); font-weight: 600; font-size: 19px;
      text-transform: uppercase; letter-spacing: 0.4px; }
    tr:hover td { background: var(--panel); }
    hr {
      border: none; border-top: 1px solid var(--border); margin: 32px 0;
    }
    strong { font-weight: 600; }
    em { color: var(--text); }
    .footer-nav {
      margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--border);
      font-size: 19px; color: var(--text-dim);
    }
  </style>
</head>
<body>
  <main>
    <nav>
      <a href="/onboard">← Back to morning ritual</a>
      <a href="/about">What is this?</a>
      <a href="/healthz">Daemon status</a>
    </nav>
    {{BODY}}
    <div class="footer-nav">
      You're reading this from the local daemon at
      <code>http://127.0.0.1:8765</code>. Nothing on this page leaves your
      computer.
    </div>
  </main>
</body>
</html>
