<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Founder Loop · Morning ritual</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-faint: #6e7681;
      --accent: #58a6ff;
      --green: #56d364;
      --green-line: #2ea043;
      --amber: #d29922;
      --red: #f85149;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      grid-template-rows: 1fr;
      max-width: 1100px; margin: 0 auto; height: 100vh;
    }
    @media (max-width: 880px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .side { border-left: none !important; border-top: 1px solid var(--border); max-height: 40vh; }
    }

    .chat {
      display: flex; flex-direction: column;
      padding: 32px 28px 24px 28px;
      overflow: hidden;
    }
    .chat header {
      margin-bottom: 14px;
    }
    .chat h1 {
      font-size: 22px; font-weight: 500; margin: 0;
      letter-spacing: -0.2px;
    }
    .chat .sub {
      font-size: 12px; color: var(--text-dim); margin-top: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .chat .sub .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
    .chat .sub .dot.dim { background: var(--amber); }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 10px 4px 8px 4px; margin-bottom: 12px;
    }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 12px;
      margin-bottom: 10px; font-size: 14px; line-height: 1.55;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.assistant {
      background: var(--panel); border: 1px solid var(--border);
      align-self: flex-start; margin-right: auto;
    }
    .msg.user {
      background: var(--accent); color: white;
      align-self: flex-end; margin-left: auto;
    }
    .msg-row { display: flex; }
    .msg.assistant ~ .typing {
      font-size: 12px; color: var(--text-faint); padding-left: 6px;
    }

    .composer {
      display: flex; gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .composer textarea {
      flex: 1; min-height: 44px; max-height: 160px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      color: var(--text); font: inherit; font-size: 14px;
      resize: none; outline: none;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer button {
      background: var(--accent); border: none; color: white;
      border-radius: 10px; padding: 0 18px; font: inherit; font-size: 14px;
      cursor: pointer; min-width: 80px;
    }
    .composer button:disabled {
      background: var(--panel-2); color: var(--text-faint); cursor: not-allowed;
    }

    .side {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 28px 22px 22px 22px;
      overflow-y: auto;
    }
    .side h2 {
      font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--text-dim); text-transform: uppercase;
      margin: 0 0 12px 0;
    }
    .side-section { margin-bottom: 22px; }

    .priorities-list { list-style: none; padding: 0; margin: 0; }
    .priority-card {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
      animation: slide-in 220ms ease-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .priority-title { font-size: 13px; font-weight: 500; }
    .priority-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .priority-weight {
      display: inline-block; font-size: 10px; padding: 1px 6px;
      border-radius: 4px; background: var(--bg); border: 1px solid var(--border);
      margin-right: 6px;
    }
    .priority-weight.w3 { color: var(--red); border-color: var(--red); }
    .priority-weight.w2 { color: var(--amber); border-color: var(--amber); }
    .priority-weight.w1 { color: var(--text-dim); }
    .priorities-empty {
      font-size: 12px; color: var(--text-faint);
      padding: 14px 12px; border: 1px dashed var(--border);
      border-radius: 10px; text-align: center;
    }

    .ration-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-dim);
    }
    .ration-row input {
      flex: 1; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 4px 6px;
      font: inherit; font-size: 12px;
    }
    .ration-row span.unit { color: var(--text-faint); }

    .sign-btn {
      width: 100%; background: transparent; border: 1px solid var(--green-line);
      color: var(--green); padding: 12px; border-radius: 10px;
      font: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background 120ms;
      margin-top: auto;
    }
    .sign-btn:enabled:hover { background: rgba(46, 160, 67, 0.12); }
    .sign-btn:disabled {
      border-color: var(--border); color: var(--text-faint); cursor: not-allowed;
    }
    .sign-result {
      margin-top: 12px; font-size: 11px; color: var(--green);
      text-align: center; line-height: 1.5;
    }

    .banner {
      font-size: 11px; padding: 8px 10px; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text-dim); margin-bottom: 14px;
    }
    .banner.warn { border-color: var(--amber); color: var(--amber); }
    .banner code { color: var(--accent); }

    /* API-key pill (Fix 6) — match the Living Knowledge page */
    .api-pill {
      margin-left: auto;
      font-size: 11px;
      padding: 4px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-dim);
    }
    .api-pill.green { color: var(--green); border-color: var(--green); }
    .api-pill.amber { color: var(--amber); border-color: var(--amber); }
    .api-pill.red   { color: var(--red);   border-color: var(--red);   }
    .help-link {
      font-size: 13px;
      color: var(--text-faint);
      text-decoration: none;
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      margin-left: 6px;
    }
    .help-link:hover { color: var(--text); border-color: var(--accent); }

    /* Undo banner for queue mutations (Fix 7) */
    .undo-banner {
      position: fixed;
      bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 16px;
      display: none; align-items: center; gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 200;
      font-size: 13px;
    }
    .undo-banner.open { display: flex; }
    .undo-banner button {
      background: var(--accent); border: none; color: white;
      padding: 5px 12px; border-radius: 4px;
      font: inherit; font-size: 12px; cursor: pointer;
    }
    .undo-banner .timer { color: var(--text-faint); font-size: 11px; }

    /* Confirm overwrite (Fix 5) */
    .sign-confirm {
      background: rgba(248, 81, 73, 0.10);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px 12px; border-radius: 5px;
      font-size: 12px; margin-bottom: 8px;
      display: none;
    }
    .sign-confirm.open { display: block; }
  </style>
</head>
<body>
  <div class="layout">
    <main class="chat">
      <header style="display:flex; align-items:center; gap:12px">
        <div style="flex:1; min-width:0">
          <h1 id="page-title">Morning ritual</h1>
          <div class="sub">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">connecting…</span>
          </div>
        </div>
        <div class="api-pill" id="api-pill" title="Click for details">checking…</div>
        <a class="help-link" id="help-link" href="/how-to-use" target="_blank"
           rel="noopener" title="Open the user guide">?</a>
      </header>
      <div id="banner" class="banner" style="display:none"></div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <textarea id="input" placeholder="…" rows="1"></textarea>
        <button id="send">Send</button>
      </div>
    </main>

    <aside class="side">
      <div class="side-section" id="priorities-section">
        <h2 id="priorities-heading">Today's priorities</h2>
        <ul id="priorities" class="priorities-list">
          <li class="priorities-empty">Priorities you commit to will appear here as we discuss them.</li>
        </ul>
      </div>

      <div class="side-section" id="settings-section">
        <h2>Settings</h2>
        <div class="ration-row" style="margin-bottom: 6px">
          <span>Entertainment ration</span>
        </div>
        <div class="ration-row">
          <input id="ration" type="number" min="0" max="720" value="60">
          <span class="unit">min after 90%</span>
        </div>
      </div>

      <div class="side-section fl-hidden" id="queues-section">
        <h2>Current queues</h2>
        <ul id="queues-list" class="priorities-list"></ul>
      </div>

      <div class="sign-confirm" id="sign-confirm">
        ⚠ Today's contract is already bound. Click <strong>Sign</strong> again to overwrite it.
      </div>
      <button id="sign" class="sign-btn" disabled>Sign contract</button>
      <div class="sign-result" id="sign-result"></div>
    </aside>
  </div>

  <div class="undo-banner" id="undo-banner">
    <span id="undo-label">…</span>
    <span class="timer" id="undo-timer">30s</span>
    <button id="undo-btn">Undo</button>
  </div>

  <script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const prioritiesEl = document.getElementById("priorities");
  const rationEl = document.getElementById("ration");
  const signBtn = document.getElementById("sign");
  const signResult = document.getElementById("sign-result");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const banner = document.getElementById("banner");
  const pageTitle = document.getElementById("page-title");
  const prioritiesHeading = document.getElementById("priorities-heading");
  const settingsSection = document.getElementById("settings-section");
  const queuesSection = document.getElementById("queues-section");
  const queuesList = document.getElementById("queues-list");
  const prioritiesSection = document.getElementById("priorities-section");

  // Read the kind injected by the server (defaults to morning).
  const kindMeta = document.querySelector('meta[name="fl-kind"]');
  const KIND = (kindMeta && kindMeta.getAttribute("content")) || "morning";

  const KIND_CONFIG = {
    morning: {
      title: "Morning ritual",
      placeholder: "Tell me one thing that matters today…",
      prioritiesHeading: "Today's priorities",
      signLabel: "Sign contract",
      showSettings: true,
      showQueues: false,
      showPriorities: true,
    },
    review: {
      title: "Nightly review",
      placeholder: "How did today go?",
      prioritiesHeading: "Tomorrow's priorities",
      signLabel: "Sign tomorrow's contract",
      showSettings: true,
      showQueues: false,
      showPriorities: true,
    },
    queues: {
      title: "Tune your queues",
      placeholder: "Add or remove items from your queues…",
      prioritiesHeading: "",
      signLabel: "Done",
      showSettings: false,
      showQueues: true,
      showPriorities: false,
    },
  };
  const cfg = KIND_CONFIG[KIND] || KIND_CONFIG.morning;
  pageTitle.textContent = cfg.title;
  inputEl.placeholder = cfg.placeholder;
  if (cfg.prioritiesHeading) prioritiesHeading.textContent = cfg.prioritiesHeading;
  signBtn.textContent = cfg.signLabel;
  if (!cfg.showSettings) settingsSection.classList.add("fl-hidden");
  if (cfg.showQueues) queuesSection.classList.remove("fl-hidden");
  if (!cfg.showPriorities) prioritiesSection.classList.add("fl-hidden");

  let conversationId = null;
  let canSign = false;
  let usingLLM = false;
  let contractAlreadyBound = false;   // Fix 5: true if the daemon told us a contract exists
  let signConfirmShown = false;       // Fix 5: track whether the warning is already visible
  let queuesUndoSnapshot = null;      // Fix 7: snapshot taken before each queues mutation
  let _undoTimer = null;              // Fix 7

  // Fix 10: deep-link the help icon to the right anchor in /how-to-use per kind.
  const KIND_HELP_ANCHOR = {
    morning: "/how-to-use#moment-1--start-your-day",
    review:  "/how-to-use#moment-4--look-back",
    queues:  "/how-to-use#moment-5--tweak-the-rules",
  };
  const helpLink = document.getElementById("help-link");
  if (helpLink) helpLink.href = KIND_HELP_ANCHOR[KIND] || "/how-to-use";

  // Fix 6: API-key pill helper. Same shape as the Living Knowledge page.
  function updateApiPill(state) {
    const pill = document.getElementById("api-pill");
    if (!pill) return;
    pill.classList.remove("green", "amber", "red");
    if (state === "ready") {
      pill.textContent = "LLM ready";
      pill.classList.add("green");
      pill.title = "Anthropic key configured. Chat goes through Claude.";
    } else if (state === "fallback") {
      pill.textContent = "no API key — fallback mode";
      pill.classList.add("amber");
      pill.title = "No ANTHROPIC_API_KEY. Conversation uses the state-machine fallback (slower).";
    } else if (state === "offline") {
      pill.textContent = "daemon offline";
      pill.classList.add("red");
      pill.title = "Cannot reach the daemon at /healthz.";
    } else {
      pill.textContent = "checking…";
      pill.title = "";
    }
  }

  function appendMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg-row";
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    if (role === "user") wrap.style.justifyContent = "flex-end";
    wrap.appendChild(el);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderPriorities(items) {
    if (!items || !items.length) {
      prioritiesEl.innerHTML =
        '<li class="priorities-empty">Priorities you commit to will appear here as we discuss them.</li>';
      return;
    }
    prioritiesEl.innerHTML = "";
    items.forEach((p) => {
      const li = document.createElement("li");
      li.className = "priority-card";
      const title = document.createElement("div");
      title.className = "priority-title";
      const w = document.createElement("span");
      w.className = "priority-weight w" + p.weight;
      w.textContent = "P" + p.weight;
      title.appendChild(w);
      title.appendChild(document.createTextNode(p.title));
      const meta = document.createElement("div");
      meta.className = "priority-meta";
      meta.textContent = p.evidence_type.replaceAll("_", " ") + " · " + p.evidence_target;
      li.appendChild(title);
      li.appendChild(meta);
      prioritiesEl.appendChild(li);
    });
  }

  async function checkHealth() {
    try {
      const r = await fetch("/healthz");
      const j = await r.json();
      contractAlreadyBound = !!j.contract_bound;
      if (j.contract_bound) {
        statusDot.classList.add("dim");
        statusText.textContent = "contract already bound for today";
        banner.style.display = "block";
        banner.className = "banner warn";
        banner.innerHTML =
          "Today's contract is already bound. Re-signing will overwrite it.";
      }
      // Fix 6: pill state, separate from the status banner
      if (!j.has_api_key || !j.use_llm) {
        if (!j.contract_bound) {
          statusText.textContent = "fallback mode — no Anthropic key configured";
          banner.style.display = "block";
          banner.className = "banner warn";
          banner.innerHTML =
            "Running without an LLM. The conversation will be functional but stiff (one field at a time). " +
            "Set <code>ANTHROPIC_API_KEY</code> and start the daemon with <code>--use-llm</code> for natural language.";
        }
        usingLLM = false;
        updateApiPill("fallback");
      } else if (!j.contract_bound) {
        statusText.textContent = "ready · LLM mode";
        usingLLM = true;
        updateApiPill("ready");
      } else {
        // contract bound + LLM ready
        usingLLM = true;
        updateApiPill("ready");
      }
    } catch (err) {
      statusDot.style.background = "#f85149";
      statusText.textContent = "daemon unreachable";
      updateApiPill("offline");
    }
  }

  async function startConversation() {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: KIND }),
    });
    const j = await r.json();
    conversationId = j.conversation_id;
    appendMessage("assistant", j.assistant_text);
    if (KIND === "queues" && j.kickoff) {
      try {
        const queues = JSON.parse(j.kickoff.split("\n").slice(2).join("\n").trim());
        renderQueues(queues);
      } catch (_) { /* ignore */ }
      // Queues page is signable from the start (sign = ack done).
      canSign = true;
      signBtn.disabled = false;
    } else if (KIND === "review" && j.kickoff) {
      // Show today's summary subtly above the chat for context.
      const note = document.createElement("div");
      note.className = "banner";
      note.style.whiteSpace = "pre-wrap";
      note.style.fontSize = "11px";
      note.textContent = j.kickoff.slice(0, 600);
      document.querySelector(".chat header").after(note);
    }
  }

  function renderQueues(queues) {
    queuesList.innerHTML = "";
    const order = ["bookmarks_queue", "social_queue", "rubber_duck_venues"];
    order.forEach((qname) => {
      const items = queues[qname] || [];
      const wrap = document.createElement("li");
      wrap.className = "priority-card";
      const head = document.createElement("div");
      head.className = "priority-title";
      head.textContent = `${qname.replaceAll("_", " ")} (${items.length})`;
      wrap.appendChild(head);
      const list = document.createElement("ul");
      list.style.fontSize = "11px";
      list.style.color = "#8b949e";
      list.style.paddingLeft = "16px";
      list.style.margin = "6px 0 0 0";
      items.slice(0, 5).forEach((it) => {
        const li = document.createElement("li");
        li.textContent = it.title || it.name || it.venue || JSON.stringify(it);
        list.appendChild(li);
      });
      if (items.length > 5) {
        const li = document.createElement("li");
        li.textContent = `… +${items.length - 5} more`;
        list.appendChild(li);
      }
      wrap.appendChild(list);
      queuesList.appendChild(wrap);
    });
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    appendMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "44px";
    sendBtn.disabled = true;
    statusText.textContent = "thinking…";
    // Fix 7: snapshot queues BEFORE the mutation so undo can restore.
    if (KIND === "queues") {
      try {
        const snap = await fetch("/queues-state");
        queuesUndoSnapshot = await snap.json();
      } catch (_) { /* if the snapshot fails, undo just won't be offered */ }
    }
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversation_id: conversationId,
          kind: KIND,
          message: text,
        }),
      });
      const j = await r.json();
      if (j.error) {
        appendMessage("assistant", "Error: " + j.error);
        return;
      }
      conversationId = j.conversation_id;
      appendMessage("assistant", j.assistant_text);
      if (cfg.showPriorities) renderPriorities(j.priorities);
      if (j.settings && typeof j.settings.entertainment_ration_min === "number") {
        rationEl.value = j.settings.entertainment_ration_min;
      }
      // For queues kind: refresh the queue panel after each turn (the
      // mutations array tells us what's changed).
      if (KIND === "queues" && j.queue_mutations && j.queue_mutations.length) {
        // Re-fetch via a fresh /chat kickoff would lose context; instead
        // poll the queues file via GET /queues-state below.
        try {
          const r2 = await fetch("/queues-state");
          const queues = await r2.json();
          renderQueues(queues);
        } catch (_) { /* ignore */ }
        // Fix 7: offer undo if we have a pre-mutation snapshot
        if (queuesUndoSnapshot) {
          const n = j.queue_mutations.length;
          showUndoBanner(`Applied ${n} queue change${n === 1 ? "" : "s"}.`);
        }
      }
      canSign = !!j.can_sign;
      if (KIND === "queues") {
        signBtn.disabled = false; // always closable
      } else {
        signBtn.disabled = !(canSign && j.priorities && j.priorities.length);
      }
      statusText.textContent = j.using_llm ? "ready · LLM mode" : "ready · fallback mode";
    } catch (err) {
      appendMessage("assistant", "Network error: " + err.message);
      statusText.textContent = "daemon unreachable";
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function signContract() {
    // Fix 5: if today's contract is already bound and this is the user's
    // FIRST click, require a second click. The .open class shows a red
    // banner explaining what re-signing does. The banner stays visible
    // until the user clicks again (confirming) or until the page reloads.
    if (KIND !== "queues" && contractAlreadyBound && !signConfirmShown) {
      signConfirmShown = true;
      document.getElementById("sign-confirm").classList.add("open");
      // Keep the button enabled so the user can confirm with a 2nd click.
      return;
    }
    signBtn.disabled = true;
    signResult.textContent = "";
    try {
      const r = await fetch("/sign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversation_id: conversationId,
          entertainment_ration_min: parseInt(rationEl.value, 10) || 60,
        }),
      });
      const j = await r.json();
      if (j.error) {
        signResult.style.color = "#f85149";
        signResult.textContent = "Failed: " + j.error;
        signBtn.disabled = false;
        return;
      }
      signResult.style.color = "var(--green)";
      if (j.kind === "queues") {
        const n = (j.queue_mutations_applied || []).length;
        signResult.innerHTML =
          "✓ " + n + " queue change" + (n === 1 ? "" : "s") + " saved.<br>" +
          "Close this tab. The next sublimation card will reference your " +
          "updated queues.";
      } else {
        const c = j.contract;
        const which = j.kind === "review" ? "tomorrow" : "today";
        signResult.innerHTML =
          "✓ Signed for " + c.date + " (" + which + ").<br>" +
          "Ration unlocks at " + c.threshold_pct + "%.<br><br>" +
          "Close this tab. The extension and tray will pick it up automatically.";
      }
    } catch (err) {
      signResult.style.color = "#f85149";
      signResult.textContent = "Network error: " + err.message;
      signBtn.disabled = false;
    }
  }

  // Fix 7: queue-mutation undo banner + handler
  function showUndoBanner(label) {
    const banner = document.getElementById("undo-banner");
    document.getElementById("undo-label").textContent = label;
    banner.classList.add("open");
    let secs = 30;
    document.getElementById("undo-timer").textContent = secs + "s";
    if (_undoTimer) clearInterval(_undoTimer);
    _undoTimer = setInterval(() => {
      secs -= 1;
      document.getElementById("undo-timer").textContent = secs + "s";
      if (secs <= 0) hideUndoBanner();
    }, 1000);
  }
  function hideUndoBanner() {
    if (_undoTimer) { clearInterval(_undoTimer); _undoTimer = null; }
    document.getElementById("undo-banner").classList.remove("open");
  }
  document.getElementById("undo-btn").addEventListener("click", async () => {
    if (!queuesUndoSnapshot) { hideUndoBanner(); return; }
    try {
      const r = await fetch("/queues-restore", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(queuesUndoSnapshot),
      });
      const j = await r.json();
      if (j.error) { alert("undo failed: " + j.error); return; }
      // Re-render the queues panel from the restored state
      try {
        const r2 = await fetch("/queues-state");
        renderQueues(await r2.json());
      } catch (_) {}
      queuesUndoSnapshot = null;
      hideUndoBanner();
    } catch (err) {
      alert("undo failed: " + err.message);
    }
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(160, inputEl.scrollHeight) + "px";
  });
  sendBtn.addEventListener("click", send);
  signBtn.addEventListener("click", signContract);

  (async function init() {
    await checkHealth();
    await startConversation();
    inputEl.focus();
  })();
  </script>
</body>
</html>
