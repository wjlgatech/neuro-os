<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment dashboard — advisory only</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #21262d;
      --panel-3: #2d333b;
      --border: #30363d;
      --border-strong: #484f58;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-faint: #6e7681;
      --accent: #58a6ff;
      --green: #56d364;
      --amber: #d29922;
      --red: #f85149;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-rows: 56px 1fr;
      height: calc(100vh - 40px);
    }

    header.top {
      display: flex; align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      gap: 18px;
    }
    header.top h1 { font-size: 16px; font-weight: 500; margin: 0; }
    header.top .sub { color: var(--text-dim); font-size: 12px; }
    header.top .advisory-pill {
      margin-left: auto;
      font-size: 11px; padding: 4px 10px;
      background: var(--panel-2);
      border: 1px solid var(--amber);
      border-radius: 12px;
      color: var(--amber);
    }
    header.top .help-link {
      margin-left: 8px;
      font-size: 14px;
      color: var(--text-faint);
      text-decoration: none;
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-2);
    }
    header.top .help-link:hover { color: var(--text); border-color: var(--accent); }
    header.top select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 8px;
      font: inherit; font-size: 12px;
      cursor: pointer;
    }

    main {
      overflow: auto;
      padding: 22px 26px 60px 26px;
      max-width: 1080px; margin: 0 auto; width: 100%;
    }

    .empty {
      max-width: 480px; margin: 80px auto;
      text-align: center; color: var(--text-dim);
    }
    .empty h2 { color: var(--text); font-weight: 500; font-size: 18px; }
    .empty code {
      background: var(--panel-2); padding: 2px 6px; border-radius: 4px;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }
    .card h3 {
      font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--text-dim); text-transform: uppercase;
      margin: 0 0 12px 0;
    }

    .big-number {
      font-size: 28px; font-weight: 300; line-height: 1.1;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
    }
    .big-number .unit { color: var(--text-dim); font-size: 14px; margin-left: 4px; }
    .big-number.positive { color: var(--green); }
    .big-number.negative { color: var(--red); }
    .sub-text {
      font-size: 12px; color: var(--text-dim);
      margin-top: 6px; line-height: 1.5;
    }

    .gap-bar {
      width: 100%; height: 6px;
      background: var(--panel-2);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0 4px 0;
    }
    .gap-bar .fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width 250ms;
    }
    .gap-bar .fill.below { background: var(--amber); }
    .gap-bar .fill.well-below { background: var(--red); }

    table.minor {
      width: 100%; border-collapse: collapse;
      font-size: 12.5px;
    }
    table.minor td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
    }
    table.minor td:last-child {
      text-align: right; font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }
    table.minor tr:last-child td { border-bottom: none; }

    .sleeve-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
    }
    .sleeve-row .name {
      flex: 0 0 110px;
      color: var(--text);
      text-transform: capitalize;
    }
    .sleeve-row .bar {
      flex: 1;
      height: 8px;
      background: var(--panel-2);
      border-radius: 2px;
      overflow: hidden;
    }
    .sleeve-row .bar .fill {
      height: 100%;
      background: var(--accent);
    }
    .sleeve-row .bar .fill.concentrated { background: var(--amber); }
    .sleeve-row .pct {
      flex: 0 0 50px;
      text-align: right;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .flag-list { list-style: none; padding: 0; margin: 0; }
    .flag-list li {
      padding: 8px 10px;
      background: var(--panel-2);
      border-left: 3px solid var(--amber);
      border-radius: 3px;
      margin-bottom: 6px;
      font-size: 12.5px;
      line-height: 1.45;
    }
    .flag-list li.high { border-left-color: var(--red); }
    .flag-list li .name {
      font-weight: 500; color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
      font-size: 11.5px;
      margin-bottom: 3px;
      display: block;
    }
    .flag-list li .desc { color: var(--text-dim); }

    .legend {
      font-size: 11.5px; color: var(--text-dim);
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      line-height: 1.6;
    }
    .legend strong { color: var(--text); }
    .legend code {
      background: var(--panel-2); padding: 1px 5px; border-radius: 3px;
      font-size: 11px; color: var(--text);
    }
    .meta {
      color: var(--text-faint); font-size: 11px;
      text-align: right;
      margin-bottom: 10px;
    }
    .topnav { display: flex; align-items: center; gap: 0; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 16px; height: 40px; font-size: 12px; flex-shrink: 0; }
    .topnav .brand { font-weight: 600; color: var(--text); text-decoration: none; padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--border); }
    .topnav a.nav-link { color: var(--text-dim); text-decoration: none; padding: 0 10px; height: 40px; display: flex; align-items: center; border-bottom: 2px solid transparent; white-space: nowrap; }
    .topnav a.nav-link:hover { color: var(--text); }
    .topnav a.nav-link.active { color: var(--text); border-bottom-color: var(--accent); }
    .topnav .spacer { flex: 1; }
    .topnav .next-btn { background: var(--accent); color: #fff; text-decoration: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .topnav .next-btn:hover { background: #79b8ff; color: #fff; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/">neuro-os</a>
    <a class="nav-link" href="/">Dashboard</a>
    <a class="nav-link" href="/onboard">Morning ritual</a>
    <a class="nav-link" href="/review">Review</a>
    <a class="nav-link" href="/research">Research</a>
    <a class="nav-link" href="/research/living-knowledge">Living knowledge</a>
    <a class="nav-link active" href="/invest/dashboard">Invest</a>
    <span class="spacer"></span>
    <a class="next-btn" href="/onboard">Next: Morning ritual →</a>
  </nav>
  <div class="layout">
    <header class="top">
      <h1>Investment dashboard</h1>
      <div class="sub" id="meta-line">loading…</div>
      <select id="window-select" title="Window in days">
        <option value="7">7 days</option>
        <option value="30" selected>30 days</option>
        <option value="60">60 days</option>
        <option value="90">90 days</option>
        <option value="180">180 days</option>
      </select>
      <span class="advisory-pill" title="The investment vertical is advisory-only: no broker integration, no trade execution. Confirmed by the design anti-goal in docs/roadmap.md.">advisory only</span>
      <a class="help-link" href="/how-to-use#investment-for-an-advisory-only-portfolio-loop"
         target="_blank" rel="noopener" title="Open the user guide for the investment vertical">?</a>
    </header>

    <main id="root">
      <div class="empty"><h2>loading…</h2></div>
    </main>
  </div>

  <script>
    const state = {
      summary: null,
      window: 30,
    };

    async function init() {
      document.getElementById("window-select").addEventListener("change", (e) => {
        state.window = parseInt(e.target.value, 10);
        reload();
      });
      await reload();
    }

    async function reload() {
      const root = document.getElementById("root");
      root.innerHTML = `<div class="empty"><h2>loading…</h2></div>`;
      try {
        const r = await fetch(`/invest/dashboard/data?window=${state.window}`);
        const data = await r.json();
        if (data.error) {
          root.innerHTML = `<div class="empty"><h2>error</h2><p>${escapeHtml(data.error)}</p></div>`;
          return;
        }
        state.summary = data.summary;
        render();
      } catch (err) {
        root.innerHTML = `<div class="empty"><h2>daemon unreachable</h2><p>${escapeHtml(String(err))}</p></div>`;
      }
    }

    function render() {
      const s = state.summary;
      const root = document.getElementById("root");
      document.getElementById("meta-line").textContent =
        `${s.window_days}-day window  ·  generated ${formatTime(s.generated_at)}`;

      const empty = !s.cost_of_living_target
        && (!s.options_strategy_summaries || s.options_strategy_summaries.length === 0)
        && (!s.sleeve_balance || s.sleeve_balance.total_theses === 0);

      root.innerHTML = "";

      // Legend
      const legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = `
        <strong>Read-only rollup</strong> of the investment vertical's local state.
        Nothing here calls a broker. The dashboard surfaces 5 health flags
        (sample-size-guarded) and 4 sub-rollups: Phase 1 options income,
        cost-of-living gap, Phase 2 mega-trend sleeve discipline, thesis
        invalidation rate. CLI equivalent: <code>neuro-os invest dashboard --window ${s.window_days}</code>.
      `;
      root.appendChild(legend);

      if (empty) {
        const div = document.createElement("div");
        div.className = "empty";
        div.innerHTML = `
          <h2>No investment data yet</h2>
          <p>The investment vertical needs at least one of:</p>
          <p><code>neuro-os invest cost-of-living set --monthly-target 14000</code></p>
          <p><code>neuro-os invest trade log --strategy ...</code></p>
          <p><code>neuro-os invest onboard --priorities ...</code></p>
        `;
        root.appendChild(div);
        renderFlags(s, root);
        return;
      }

      // Top-row stat cards
      const grid = document.createElement("div");
      grid.className = "grid";

      // Cost of living + income gap
      grid.appendChild(renderCostOfLivingCard(s));
      // Options PnL
      grid.appendChild(renderOptionsPnLCard(s));
      // Thesis correct rate
      grid.appendChild(renderThesisRateCard(s));

      root.appendChild(grid);

      // Options strategy summaries
      if (s.options_strategy_summaries && s.options_strategy_summaries.length) {
        root.appendChild(renderStrategyTable(s));
      }

      // Sleeve balance
      if (s.sleeve_balance && s.sleeve_balance.total_theses > 0) {
        root.appendChild(renderSleeveBalance(s));
      }

      // Health flags
      renderFlags(s, root);
    }

    function renderCostOfLivingCard(s) {
      const card = document.createElement("div");
      card.className = "card";
      if (!s.cost_of_living_target) {
        card.innerHTML = `
          <h3>Cost of living</h3>
          <div class="big-number" style="color:var(--text-faint)">—</div>
          <div class="sub-text">No monthly target set. Run <code>neuro-os invest cost-of-living set --monthly-target X</code>.</div>
        `;
        return card;
      }
      const gap = s.income_gap;
      const target = s.cost_of_living_target;
      const covered = gap ? Math.max(0, target - gap.gap_dollars) : 0;
      const pct = gap ? Math.round((1 - gap.gap_pct) * 100) : 100;
      let barClass = "";
      if (pct < 50) barClass = "well-below";
      else if (pct < 100) barClass = "below";
      card.innerHTML = `
        <h3>Cost of living coverage</h3>
        <div class="big-number ${pct >= 100 ? "positive" : pct < 50 ? "negative" : ""}">${pct}%</div>
        <div class="gap-bar"><div class="fill ${barClass}" style="width:${Math.min(100, pct)}%"></div></div>
        <div class="sub-text">
          <strong>$${fmtMoney(target)}</strong> monthly target  ·
          <strong>$${fmtMoney(covered)}</strong> covered  ·
          gap <strong>$${fmtMoney(gap ? gap.gap_dollars : target)}</strong>
        </div>
      `;
      return card;
    }

    function renderOptionsPnLCard(s) {
      const card = document.createElement("div");
      card.className = "card";
      const p = s.options_monthly_pnl;
      if (!p) {
        card.innerHTML = `
          <h3>Options income (30d)</h3>
          <div class="big-number" style="color:var(--text-faint)">—</div>
          <div class="sub-text">No options trades in window. Run <code>neuro-os invest trade log ...</code>.</div>
        `;
        return card;
      }
      const cls = p.net_pnl > 0 ? "positive" : p.net_pnl < 0 ? "negative" : "";
      card.innerHTML = `
        <h3>Options net PnL (${s.window_days}d)</h3>
        <div class="big-number ${cls}">${p.net_pnl >= 0 ? "+" : ""}$${fmtMoney(p.net_pnl)}</div>
        <div class="sub-text">
          <strong>${p.trade_count}</strong> trades  ·
          premium collected <strong>$${fmtMoney(p.total_premium)}</strong>  ·
          realized losses <strong>$${fmtMoney(Math.abs(p.total_realized_losses || 0))}</strong>
        </div>
      `;
      return card;
    }

    function renderThesisRateCard(s) {
      const card = document.createElement("div");
      card.className = "card";
      const t = s.thesis_correct_rate;
      if (!t || t.total_predictions === 0) {
        card.innerHTML = `
          <h3>Thesis discipline</h3>
          <div class="big-number" style="color:var(--text-faint)">—</div>
          <div class="sub-text">No closed theses yet. Predictions need invalidation to score.</div>
        `;
        return card;
      }
      const cls = t.correct_rate >= 0.6 ? "positive" : t.correct_rate < 0.4 ? "negative" : "";
      card.innerHTML = `
        <h3>Thesis correct rate</h3>
        <div class="big-number ${cls}">${Math.round(t.correct_rate * 100)}%</div>
        <div class="sub-text">
          <strong>${t.correct_predictions}</strong> correct of
          <strong>${t.total_predictions}</strong> closed theses  ·
          ${t.invalidated_count} invalidated
        </div>
      `;
      return card;
    }

    function renderStrategyTable(s) {
      const card = document.createElement("div");
      card.className = "card";
      let rows = "";
      for (const sum of s.options_strategy_summaries) {
        const winPct = sum.total > 0 ? Math.round((sum.wins / sum.total) * 100) : 0;
        rows += `
          <tr>
            <td>${escapeHtml(sum.strategy)}</td>
            <td>${sum.total} trades</td>
            <td>${winPct}% win</td>
            <td>$${fmtMoney(sum.net_pnl)}</td>
          </tr>
        `;
      }
      card.innerHTML = `
        <h3>Options strategy breakdown</h3>
        <table class="minor">${rows}</table>
      `;
      return card;
    }

    function renderSleeveBalance(s) {
      const card = document.createElement("div");
      card.className = "card";
      const sb = s.sleeve_balance;
      const rows = sb.allocations.map(a => {
        const cls = sb.sleeves_concentrated.includes(a.sleeve) ? "concentrated" : "";
        const pct = Math.round(a.pct * 100);
        return `
          <div class="sleeve-row">
            <span class="name">${escapeHtml(a.sleeve)}</span>
            <div class="bar"><div class="fill ${cls}" style="width:${pct}%"></div></div>
            <span class="pct">${pct}% (${a.theses_count})</span>
          </div>
        `;
      }).join("");
      const warning = sb.sleeves_concentrated.length
        ? `<div class="sub-text" style="color:var(--amber); margin-top:10px">
            ⚠ Concentrated (>40%): ${sb.sleeves_concentrated.map(escapeHtml).join(", ")}
          </div>`
        : "";
      card.innerHTML = `
        <h3>Mega-trend sleeve allocation (${sb.total_theses} active theses)</h3>
        ${rows}
        ${warning}
      `;
      return card;
    }

    const FLAG_DESCRIPTIONS = {
      "no_cost_of_living_target": [
        "high", "Set a monthly cost-of-living target so the dashboard can compute the income gap. Without it, every other metric is unanchored."
      ],
      "phase1_income_gap_unmet": [
        "amber", "Last month's options income covers less than 100% of your cost-of-living target. The dashboard surfaces this so you know whether to add income-generating trades."
      ],
      "single_sleeve_concentration": [
        "amber", "At least one mega-trend sleeve holds >40% of capital. You're betting on one trend, not a basket. Consider trimming the concentrated sleeve or adding to under-represented ones."
      ],
      "no_thesis_invalidation": [
        "amber", "≥10 active theses with zero invalidations. Either perfect foresight (unlikely) or no discipline. Invalidation_condition is the part of a thesis you act on."
      ],
      "options_loss_concentration": [
        "high", "≥20 closed options trades show negative realized PnL despite the win-rate. This is the 'high win-rate but losing money' failure mode — stop opening new positions in this strategy and audit."
      ],
    };

    function renderFlags(s, root) {
      const flags = s.system_health_flags || [];
      const card = document.createElement("div");
      card.className = "card";
      card.style.marginTop = "10px";
      if (!flags.length) {
        card.innerHTML = `
          <h3>System health flags</h3>
          <div class="sub-text" style="color:var(--green)">✓ No flags firing. Substrate is healthy.</div>
        `;
        root.appendChild(card);
        return;
      }
      const items = flags.map(f => {
        const [sev, desc] = FLAG_DESCRIPTIONS[f] || ["amber", "(no description)"];
        return `
          <li class="${sev}">
            <span class="name">${escapeHtml(f)}</span>
            <span class="desc">${escapeHtml(desc)}</span>
          </li>
        `;
      }).join("");
      card.innerHTML = `
        <h3>System health flags (${flags.length})</h3>
        <ul class="flag-list">${items}</ul>
      `;
      root.appendChild(card);
    }

    function fmtMoney(n) {
      if (n === null || n === undefined) return "—";
      const abs = Math.abs(n);
      if (abs >= 1000) {
        return Math.round(n).toLocaleString();
      }
      return n.toFixed(2);
    }

    function formatTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString();
      } catch (_) {
        return iso;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    }

    init();
  </script>
</body>
</html>
